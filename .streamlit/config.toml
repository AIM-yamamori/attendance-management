# Streamlit設定ファイル
#
# 【なぜこの設定が必要か】
# Streamlitは、アプリ直下に "pages" という名前のディレクトリがあると、
# st.navigation() を呼ぶ前の状態（＝本アプリではログイン前の状態）でも
# 自動的にそれらをマルチページとして検出し、サイドバーに一覧表示して
# しまうことがある。
#
# 本アプリでは実ファイルを "_pages/"（アンダースコア始まり）に置くことで
# 自動検出の対象から外しているが、念のためここでも明示的に
# 自動サイドバーナビゲーションを無効化しておく。
# ページの表示は app.py 内の st.navigation() 経由のみで行う。
[client]
showSidebarNavigation = false